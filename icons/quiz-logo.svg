<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Common style for the tile outlines -->
    <style>
      .tile {
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 24;
        stroke-linejoin: round;
      }
      .letter {
        fill: #000000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: bold;
        font-size: 130px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Background Grid Layout -->
  <!-- Top Left Tile: Q -->
  <rect x="20" y="20" width="226" height="226" rx="50" ry="50" class="tile" />
  <text x="133" y="133" class="letter">Q</text>

  <!-- Top Right Tile: U -->
  <rect x="266" y="20" width="226" height="226" rx="50" ry="50" class="tile" />
  <text x="379" y="133" class="letter">U</text>

  <!-- Bottom Left Tile: I -->
  <rect x="20" y="266" width="226" height="226" rx="50" ry="50" class="tile" />
  <text x="133" y="379" class="letter">I</text>

  <!-- Bottom Right Tile: Z -->
  <rect x="266" y="266" width="226" height="226" rx="50" ry="50" class="tile" />
  <text x="379" y="379" class="letter">Z</text>
</svg>
