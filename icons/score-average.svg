<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- Left Bar (Below Average Student Score) -->
  <rect x="64" y="260" width="64" height="180" rx="12" fill="url(#gradOrange)" />
  
  <!-- Right Bar (High Performing Student Score) -->
  <rect x="384" y="120" width="64" height="320" rx="12" fill="url(#gradGreen)" />

  <!-- Center Bar (The Average Student Score - Highlighted) -->
  <rect x="224" y="180" width="64" height="260" rx="12" fill="url(#gradBlue)" />

  <!-- Base Ground Line Layer -->
  <line x1="32" y1="440" x2="480" y2="440" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" />

  <!-- Student Graduation Cap over the Average Bar -->
  <g id="student-cap" transform="translate(0, -10)">
    <!-- Cap Diamond Top Shape -->
    <path d="M 256,60 L 326,96 L 256,132 L 186,96 Z" fill="#6366F1" />
    <!-- Cap Skull Base Base Layer -->
    <path d="M 212,112 L 212,138 C 212,150 228,160 256,160 C 284,160 300,150 300,138 L 300,112" fill="#6366F1" />
    <!-- Tassel Cord and Small Drop Bead Hanging Left -->
    <path d="M 256,96 L 196,118 L 194,136" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="194" cy="138" r="4" fill="#F59E0B" />
  </g>

  <!-- Mathematical Average (x-bar) / Mean Trendline Element -->
  <path d="M 64,210 Q 160,200 256,140 T 448,70" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
  <!-- Trendline Indicator Node Dot -->
  <circle cx="256" cy="140" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
</svg>
